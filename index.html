<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input & Riwayat - TripByIhyat</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { background-color: #e9ecef; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; margin-bottom: 20px; }
        h2 { color: #6b162c; text-align: center; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #f7c45a; padding-bottom: 10px; font-size: 1.2rem;}
        
        .section-title { background-color: #fbecef; color: #6b162c; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin: 20px 0 15px 0; font-size: 0.9rem;}
        
        .form-group { margin-bottom: 15px; width: 100%; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: #333; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; background: #fff; }
        
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; width: 100%;}
        .btn-invoice { background-color: #f7c45a; color: #6b162c; border: 2px solid #6b162c;}
        .btn-invoice:hover { background-color: #e0b04c; }
        .btn-receipt { background-color: #6b162c; color: white; }
        .btn-receipt:hover { background-color: #4a0f1d; }

        /* CSS Tabel Riwayat */
        .history-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; overflow: hidden; }
        .history-card h3 { color: #6b162c; margin-top: 0; font-size: 1.1rem; }
        
        /* Wrapper agar tabel bisa di-scroll di HP */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; min-width: 600px; }
        th { background-color: #fbecef; color: #6b162c; padding: 10px; text-align: left; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        /* Tombol Aksi Tabel */
        .btn-action { padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem; margin-right: 2px; margin-bottom: 4px; display: inline-block;}
        .btn-pay { background-color: #0d6efd; color: white; }
        .btn-inv { background-color: #f7c45a; color: #333; }
        .btn-rec { background-color: #6b162c; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; white-space: nowrap;}
        .bg-lunas { background-color: #198754; }
        .bg-belum { background-color: #d9534f; }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .btn-group { flex-direction: column; gap: 10px; }
            .card, .history-card { padding: 15px; }
            table { font-size: 0.8rem; }
            th, td { padding: 8px; }
        }

        /* =========================================
           CSS UNTUK MODAL PEMBAYARAN CUSTOM
           ========================================= */
        .modal-overlay {
            display: none; /* Disembunyikan default */
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fbecef; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { color: #6b162c; font-weight: 800; font-size: 1.1rem; margin: 0; }
        .modal-info { font-size: 0.85rem; color: #555; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 3px solid #f7c45a; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { padding: 10px; font-size: 0.9rem; }
        .btn-cancel { background-color: #e9ecef; color: #333; }
    </style>
</head>
<body>

    <!-- FORM INPUT -->
    <div class="card">
        <h2>Buat Dokumen Baru</h2>
        
        <div class="section-title">👤 Data Pemesan & Perjalanan</div>
        <div class="form-row">
            <div class="form-group">
                <label>No. Dokumen</label>
                <input type="text" id="invNo" value="TBI-INV-157">
            </div>
            <div class="form-group">
                <label>Tanggal Cetak</label>
                <input type="date" id="date" value="2026-11-07">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Diterima Dari (Nama PT/Orang)</label>
                <input type="text" id="client" value="PT ZAM ZAM WISATA">
            </div>
            <div class="form-group">
                <label>No. WhatsApp</label>
                <input type="tel" id="wa" value="6281287825694" inputmode="numeric" pattern="[0-9]*">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Jenis Perjalanan</label>
                <select id="type">
                    <option value="Umrah">Umrah</option>
                    <option value="Haji">Haji</option>
                    <option value="Wisata">Wisata</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah Peserta</label>
                <input type="number" id="pax" value="45" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="form-group">
                <label>Tgl Perjalanan</label>
                <input type="date" id="travelDate" value="2027-06-27">
            </div>
        </div>

        <div class="form-group">
            <label>Paket / Tujuan</label>
            <input type="text" id="package" value="B2B KEB. UMROH JUNI 2027 12HARI BY SV">
        </div>

        <div class="section-title">💰 Rincian Biaya & Pembayaran Pertama (DP)</div>
        <div class="form-row">
            <div class="form-group">
                <label>Total Biaya (Rp)</label>
                <input type="text" id="totalBill" value="45.000.000" inputmode="numeric" onkeyup="formatRupiah(this)">
            </div>
            <div class="form-group">
                <label>Uang Masuk / DP (Rp)</label>
                <input type="text" id="amountPaid" value="10.000.000" inputmode="numeric" onkeyup="formatRupiah(this)">
            </div>
            <div class="form-group">
                <label>Keterangan Pembayaran</label>
                <input type="text" id="desc" value="Pembayaran DP 10 Pax">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-invoice" onclick="simpanData('invoice')">📄 Simpan & Cetak Invoice</button>
            <button class="btn btn-receipt" onclick="simpanData('receipt')">🧾 Simpan & Cetak Tanda Terima DP</button>
        </div>
    </div>

    <!-- TABEL RIWAYAT -->
    <div class="history-card">
        <h3>📁 Riwayat Dokumen & Pembayaran</h3>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No. Invoice</th>
                        <th>Klien</th>
                        <th>Total Biaya</th>
                        <th>Dibayar</th>
                        <th>Sisa</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelRiwayat">
                    <!-- Data diisi JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- =========================================
         MODAL POP-UP UNTUK PEMBAYARAN LANJUTAN
         ========================================= -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">💰 Terima Pembayaran</h3>
            </div>
            
            <div class="modal-info" id="modal-info-text">
                Sisa tagihan: Rp 0
            </div>

            <div class="form-group">
                <label>Nominal Pembayaran Baru (Rp)</label>
                <input type="text" id="inputNewPayment" placeholder="Contoh: 5.000.000" inputmode="numeric" onkeyup="formatRupiah(this)">
            </div>

            <div class="form-group">
                <label>Keterangan Pembayaran</label>
                <input type="text" id="inputNewDesc" placeholder="Contoh: Cicilan 1, Pelunasan" value="Pembayaran Lanjutan">
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="tutupModal()">Batal</button>
                <button class="btn btn-receipt" onclick="simpanPembayaranBaru()">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // --- FUNGSI FORMAT TITIK RUPIAH SAAT DIKETIK ---
        function formatRupiah(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                value = parseInt(value, 10).toLocaleString('id-ID');
            }
            input.value = value;
        }

        const rupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        let daftarRiwayat = JSON.parse(localStorage.getItem('riwayatDokumen')) || [];
        
        // Variabel untuk menyimpan index data yang sedang diedit di modal
        let currentPayIndex = -1;

        function tampilkanRiwayat() {
            const tbody = document.getElementById('tabelRiwayat');
            tbody.innerHTML = '';
            
            if(daftarRiwayat.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#888;">Belum ada riwayat dokumen.</td></tr>';
                return;
            }

            daftarRiwayat.forEach((item, index) => {
                const totalDibayar = item.payments.reduce((sum, p) => sum + p.amount, 0);
                const sisa = item.totalBill - totalDibayar;
                const statusClass = sisa <= 0 ? 'bg-lunas' : 'bg-belum';
                const statusText = sisa <= 0 ? 'LUNAS' : 'BELUM LUNAS';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.invNo}</strong><br><small style="color:#888">${item.date}</small></td>
                    <td>${item.client}</td>
                    <td>${rupiah(item.totalBill)}</td>
                    <td style="color: #198754; font-weight:bold;">${rupiah(totalDibayar)}</td>
                    <td style="color: #d9534f; font-weight:bold;">${rupiah(sisa)}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td style="white-space: nowrap;">
                        <button class="btn-action btn-pay" onclick="bukaModalPembayaran(${index})">+ Bayar</button>
                        <button class="btn-action btn-inv" onclick="cetakDokumen(${index}, 'invoice')">Invoice</button>
                        <button class="btn-action btn-rec" onclick="pilihTandaTerima(${index})">Tanda Terima</button>
                        <button class="btn-action btn-delete" onclick="hapusData(${index})">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Simpan Data Baru (DP Pertama)
        function simpanData(docType) {
            let rawTotalBill = document.getElementById('totalBill').value.replace(/\./g, '');
            let rawAmountPaid = document.getElementById('amountPaid').value.replace(/\./g, '');

            const data = {
                id: Date.now(),
                invNo: document.getElementById('invNo').value,
                date: document.getElementById('date').value,
                client: document.getElementById('client').value,
                wa: document.getElementById('wa').value,
                type: document.getElementById('type').value,
                pax: document.getElementById('pax').value,
                package: document.getElementById('package').value,
                travelDate: document.getElementById('travelDate').value,
                totalBill: parseFloat(rawTotalBill) || 0,
                payments: [
                    {
                        date: document.getElementById('date').value,
                        amount: parseFloat(rawAmountPaid) || 0,
                        desc: document.getElementById('desc').value
                    }
                ]
            };

            const indexExist = daftarRiwayat.findIndex(item => item.invNo === data.invNo);
            if (indexExist !== -1) {
                daftarRiwayat[indexExist] = data; 
            } else {
                daftarRiwayat.push(data); 
            }

            localStorage.setItem('riwayatDokumen', JSON.stringify(daftarRiwayat));
            localStorage.setItem('invoiceAktif', JSON.stringify(data));
            localStorage.setItem('printType', docType);
            localStorage.setItem('paymentIndex', 0); 
            
            window.location.href = 'preview.html';
        }

        // ==========================================
        // FUNGSI MODAL PEMBAYARAN
        // ==========================================
        
        // Buka Modal
        function bukaModalPembayaran(index) {
            const item = daftarRiwayat[index];
            const totalDibayar = item.payments.reduce((sum, p) => sum + p.amount, 0);
            const sisa = item.totalBill - totalDibayar;

            if (sisa <= 0) {
                alert("Invoice ini sudah LUNAS.");
                return;
            }

            currentPayIndex = index; // Simpan index yang sedang dibayar
            document.getElementById('modal-info-text').innerHTML = `
                Invoice: <b>${item.invNo}</b><br>
                Sisa tagihan: <b style="color: #d9534f;">${rupiah(sisa)}</b>
            `;
            
            // Reset form modal
            document.getElementById('inputNewPayment').value = '';
            document.getElementById('inputNewDesc').value = 'Pembayaran Lanjutan';
            
            // Tampilkan Modal
            document.getElementById('paymentModal').style.display = 'flex';
            
            // Fokus ke input nominal
            setTimeout(() => document.getElementById('inputNewPayment').focus(), 100);
        }

        // Tutup Modal
        function tutupModal() {
            document.getElementById('paymentModal').style.display = 'none';
            currentPayIndex = -1;
        }

        // Simpan dari Modal
        function simpanPembayaranBaru() {
            if (currentPayIndex === -1) return;

            let nominalStr = document.getElementById('inputNewPayment').value.replace(/\./g, '');
            let nominal = parseFloat(nominalStr);
            let ket = document.getElementById('inputNewDesc').value.trim();

            if (isNaN(nominal) || nominal <= 0) {
                alert("Masukkan nominal pembayaran yang valid!");
                return;
            }

            if (ket === '') ket = "Pembayaran Lanjutan";

            const item = daftarRiwayat[currentPayIndex];
            const totalDibayar = item.payments.reduce((sum, p) => sum + p.amount, 0);
            const sisa = item.totalBill - totalDibayar;

            // Peringatan jika bayar melebihi sisa (opsional, tapi disarankan)
            if (nominal > sisa) {
                if (!confirm(`Nominal yang dimasukkan (${rupiah(nominal)}) melebihi sisa tagihan (${rupiah(sisa)}). Lanjutkan?`)) {
                    return;
                }
            }

            const today = new Date().toISOString().split('T')[0];

            // Tambahkan pembayaran ke array
            item.payments.push({
                date: today,
                amount: nominal,
                desc: ket
            });

            localStorage.setItem('riwayatDokumen', JSON.stringify(daftarRiwayat));
            
            tutupModal(); // Tutup modal dulu
            tampilkanRiwayat(); // Update tabel

            // Tanya apakah mau langsung cetak Tanda Terima
            setTimeout(() => {
                if(confirm("Pembayaran berhasil disimpan. Cetak Tanda Terima sekarang?")) {
                    const lastPaymentIndex = item.payments.length - 1;
                    localStorage.setItem('invoiceAktif', JSON.stringify(item));
                    localStorage.setItem('printType', 'receipt');
                    localStorage.setItem('paymentIndex', lastPaymentIndex);
                    window.location.href = 'preview.html';
                }
            }, 300);
        }

        // ==========================================

        function pilihTandaTerima(index) {
            const item = daftarRiwayat[index];
            let pesan = "Pilih nomor pembayaran yang ingin dicetak Tanda Terimanya:\n\n";
            
            item.payments.forEach((p, i) => {
                pesan += `${i + 1}. ${p.date} - ${p.desc} (${rupiah(p.amount)})\n`;
            });
            
            let pilihan = prompt(pesan + "\nKetik angka (1, 2, dst):");
            if (!pilihan) return;
            
            let pIndex = parseInt(pilihan) - 1;
            
            if (pIndex >= 0 && pIndex < item.payments.length) {
                cetakDokumen(index, 'receipt', pIndex);
            } else {
                alert("Pilihan tidak valid.");
            }
        }

        function cetakDokumen(index, docType, paymentIndex = null) {
            localStorage.setItem('invoiceAktif', JSON.stringify(daftarRiwayat[index]));
            localStorage.setItem('printType', docType);
            
            if (docType === 'receipt' && paymentIndex !== null) {
                localStorage.setItem('paymentIndex', paymentIndex);
            } else {
                localStorage.removeItem('paymentIndex'); 
            }
            
            window.location.href = 'preview.html';
        }

        function hapusData(index) {
            if(confirm("Yakin ingin menghapus seluruh data invoice ini?")) {
                daftarRiwayat.splice(index, 1);
                localStorage.setItem('riwayatDokumen', JSON.stringify(daftarRiwayat));
                tampilkanRiwayat();
            }
        }

        window.onload = tampilkanRiwayat;
    </script>
</body>
</html>
